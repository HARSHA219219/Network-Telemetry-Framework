# Auto-provisions PostgreSQL as Grafana's datasource. No custom plugin -
# Grafana's built-in postgres datasource queries backend/models/orm.py's
# tables directly.
#
# Uses Grafana's environment-variable expansion in provisioning files
# (supported in the pinned Grafana 11.3.0 image via docker-compose.yml's
# GF_TELEMETRY_DB_* variables). If your Grafana version doesn't expand
# these, replace the ${...} placeholders below with literal values
# matching your .env (POSTGRES_DB/POSTGRES_USER/POSTGRES_PASSWORD).

apiVersion: 1

datasources:
  - name: PostgreSQL-Telemetry
    uid: postgres-telemetry
    type: postgres
    access: proxy
    url: ${GF_TELEMETRY_DB_HOST}
    database: ${GF_TELEMETRY_DB_NAME}
    user: ${GF_TELEMETRY_DB_USER}
    secureJsonData:
      password: ${GF_TELEMETRY_DB_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: true
