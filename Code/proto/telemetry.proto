syntax = "proto3";

package telemetry;

// A single metric observation, flexible enough to represent both
// device-level metrics (interface_name/interface_index unset) and
// interface-level metrics (both set).
message TelemetryRecord {
  string device_id = 1;
  string device_ip = 2;
  int64 timestamp_unix_ms = 3;

  // e.g. "bandwidth_in", "bandwidth_out", "utilization_in",
  // "utilization_out", "latency_avg_ms", "packet_loss_percent",
  // "device_reachable", "interface_oper_status"
  string metric_type = 4;

  double metric_value = 5;
  string unit = 6;                 // "bps", "percent", "ms", "bool"

  string interface_name = 7;       // empty for device-level metrics
  int32 interface_index = 8;       // -1 / unset for device-level metrics

  map<string, string> labels = 9;  // free-form metadata, e.g. {"kind": "router"}
}

message TelemetryBatch {
  repeated TelemetryRecord records = 1;
  string collector_id = 2;         // identifies which collector instance sent this
}

message SendTelemetryBatchResponse {
  bool accepted = 1;
  int32 records_stored = 2;
  string message = 3;
}

service TelemetryIngestion {
  // Primary ingestion path: a collector sends everything gathered in one
  // poll round as a single batched RPC rather than one call per metric.
  rpc SendTelemetryBatch(TelemetryBatch) returns (SendTelemetryBatchResponse);
}
