# Alert engine thresholds. Loaded by backend/alerts.
# Values are the point at which an ACTIVE alert is raised;
# an alert is RESOLVED when the metric returns below threshold
# (with hysteresis handled in code to avoid flapping).

thresholds:
  bandwidth_utilization_percent: 80
  latency_ms: 100
  packet_loss_percent: 5

# Consecutive breaching polls required before an alert fires,
# to avoid single-sample noise triggering false alerts.
consecutive_breaches_required: 2
