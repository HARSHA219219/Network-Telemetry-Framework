# Device inventory.
#
# `authorized: true` is REQUIRED for a device to be polled when
# collector.mode == SNMP. It is ignored (all devices are always "usable")
# when collector.mode == SIMULATION.
#
# SNMP community strings are NEVER stored here. They are read from
# environment variables (see .env.example) keyed by device_id.

devices:
  - device_id: router-01
    ip: 10.0.0.1
    authorized: false      # flip to true only once you have permission to poll this host
    kind: router

  - device_id: router-02
    ip: 10.0.0.2
    authorized: false
    kind: router

  - device_id: switch-01
    ip: 10.0.0.3
    authorized: false
    kind: switch

  - device_id: switch-02
    ip: 10.0.0.4
    authorized: false
    kind: switch
